global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'universal-ai-gateway'
    metrics_path: '/admin/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['127.0.0.1:8081']
        labels:
          service: 'universal-ai-gateway'
          env: 'production'
