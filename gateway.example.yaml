# Universal AI Gateway 示例配置（复制为 gateway.yaml 后修改）。字段说明见 spec/03_config.md。
server:
  data_listen: "0.0.0.0:8080"
  admin_listen: "127.0.0.1:8081"
  data_dir: "./data"
  master_key_file: "./secrets/master.key"   # 不得位于 data_dir 之下
  shutdown_grace: 30s
  log_level: info
  read_header_timeout: 10s
  read_timeout: 60s
  idle_timeout: 120s
  max_header_bytes: 65536
  # 通过 Caddy / nginx 等反向代理对外时，填写代理所在地址，网关才会信任 X-Forwarded-For
  trusted_proxies: []        # 例如 ["127.0.0.1/32", "::1/128"]
  # 管理面（含 /admin/ui/ 管理页面）除 127.0.0.1、::1、localhost 之外额外允许的 Host 主机名（spec/09 UI-20）。
  # 用 SSH 端口转发访问时不需要填写。
  admin_hosts: []

limits:
  max_request_body_bytes: 33554432     # 缓冲请求体上限（JSON 请求）
  max_stream_body_bytes: 536870912     # 流式请求体上限（文件上传等）
  max_in_flight_requests: 256
  max_buffered_body_bytes: 536870912
  preauth_ip_rpm: 600

mcp:                                  # /mcp 端点：让 AI 以 MCP 工具的方式调用网关（spec/14）
  disabled: false
  max_result_bytes: 4194304
  tool_mode: auto                     # auto | direct | catalog：工具多时只列出搜索 / 查看 / 调用三个目录工具
  auto_threshold: 8                   # auto：客户端可见工具不超过 8 个时直接列出
  pinned_tools: []                    # 目录模式下仍然直接列出的工具名

ledger:
  flush_interval: 250ms
  event_queue_capacity: 4096
  admission_high_watermark: 0.9

audit:
  queue_capacity: 8192
  batch_size: 256
  flush_interval: 250ms
  retention_days: 30

# 转译层未知字段策略（spec/10 §1 第 5 条，CFG-15）：
#   reject（默认）：出现协议转换不支持的未定义字段时返回 400；
#   drop：丢弃未定义字段继续处理并记单次告警日志（接入 Claude Code、Codex CLI 等智能体客户端时建议开启）。
# translation:
#   unknown_fields: reject

pools:
  - name: anthropic-main
    protocol: anthropic
    base_url: "https://api.anthropic.com"
    strategy: least_inflight
    affinity_ttl: 5m
    max_attempts: 3

  - name: deepseek
    protocol: openai_chat
    base_url: "https://api.deepseek.com"
    strategy: weighted_round_robin

  - name: openai
    protocol: openai_responses          # Responses API（Codex CLI 等使用）
    base_url: "https://api.openai.com"
    pin_ttl: 720h                       # 上游保存响应 30 天；previous_response_id 需要回到同一个 Key

# models 是客户端可见的「服务」：大模型、搜索、文档解析……都在这里登记。
#   price：计量单位 → "USD[/PER]"。单位由出站适配器定义（spec/08 §3.1），必须全部定价（可以写 "0"）。
#   reserve：预留用量的上限兼默认值（spec/06 PRC-03）。
models:
  - name: "claude-sonnet-4-5"
    pool: anthropic-main
    upstream_model: "claude-sonnet-4-5"
    price:
      input_tokens: "3/1M"
      output_tokens: "15/1M"
      cache_read_tokens: "0.30/1M"
      cache_write_tokens: "3.75/1M"
    reserve: { output_tokens: 64000 }

  - name: "deepseek-chat"
    pool: deepseek
    price: { input_tokens: "0.27/1M", output_tokens: "1.10/1M", cache_read_tokens: "0.07/1M" }
    reserve: { output_tokens: 8192 }

  - name: "gpt-5"
    pool: openai
    price: { input_tokens: "1.25/1M", output_tokens: "10/1M", cache_read_tokens: "0.125/1M" }
    reserve: { output_tokens: 32000 }

